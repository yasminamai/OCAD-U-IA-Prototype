document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

percase;\">Intro to Portfolios<\u002Fh1>\n                <\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:44px; align-items:end;\">\n                  <div><\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; gap:12px;\">\n                    <div style=\"position:relative; height:320px; background:#4a4a45; border:1px solid #5c5c56; display:grid; place-items:center; font-family:ui-monospace, Menlo, monospace; font-size:11.5px; letter-spacing:0.2em; color:#b0b0a8;\">\n                      <span>VIDEO — {{ guideVideoState }}<\u002Fspan>\n                      <button sc-camel-on-click=\"{{ toggleGuideVideo }}\" style=\"{{ guideVideoBtnStyle }}\" style-hover=\"background:#e2e2dc;\">\n                        <span style=\"{{ guidePlayGlyph }}\">▶<\u002Fspan>\n                        <span style=\"{{ guidePauseGlyph }}\">\n                          <span style=\"display:block; width:5px; height:20px; background:currentColor;\"><\u002Fspan>\n                          <span style=\"display:block; width:5px; height:20px; background:currentColor;\"><\u002Fspan>\n                        <\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fdiv>\n                    <span style=\"display:block; padding-right:110px; font-size:15px; color:#f2f2ee;\">WATCH: How to make a portfolio to apply to OCAD University<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"display:grid; grid-template-columns:minmax(0,1.6fr) minmax(260px,0.8fr); gap:56px; align-items:start;\">\n                <div style=\"display:flex; flex-direction:column; gap:20px;\">\n                  <span style=\"font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:#3a3a37;\">Let’s get started:<\u002Fspan>\n                  <h2 style=\"margin:0; font-size:40px; font-weight:700; letter-spacing:-0.025em;\">What is a Portfolio?<\u002Fh2>\n                  <p style=\"margin:0; max-width:60ch; font-size:16.5px; line-height:1.85; color:#2e2e2b; text-wrap:pretty;\">The portfolio is one of the most important tools for an artist or designer. A collection of your best art/design work that showcases your creativity, thinking, and skill. It’s what you will use to apply for programs, jobs, grants, gallery spaces, and more.<\u002Fp>\n                  <p style=\"margin:0; max-width:60ch; font-size:16.5px; line-height:1.85; color:#2e2e2b; text-wrap:pretty;\">Your portfolio is one of the first points of contact with a potential client, institution or funding body, and it is the chance to make an impression. Don’t fret: every creative has stressed over their portfolio. Something to keep in mind is that it will never be complete — as your work changes and you evolve as a creative, so will your portfolio.<\u002Fp>\n                  <p style=\"margin:0; max-width:60ch; font-size:16.5px; line-height:1.85; color:#2e2e2b; text-wrap:pretty;\">Below are some tips to put together a strong portfolio, and remember that we’re always here to help through portfolio clinics, reviews, National Portfolio Days and more:<\u002Fp>\n                  <button sc-camel-on-click=\"{{ goSubsiteVisit }}\" style=\"display:flex; align-items:center; gap:16px; align-self:flex-start; margin-top:6px; border:0; background:transparent; padding:0; font-size:12.5px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#2e2e2b; cursor:pointer;\" style-hover=\"opacity:0.65;\">\n                    <span>Explore portfolio-based events<\u002Fspan>\n                    <span style=\"font-size:16px; line-height:1;\">⟶<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; gap:14px;\">\n                  <span style=\"font-size:19px; color:#2e2e2b;\">Take the Next Step<\u002Fspan>\n                  <button sc-came .02em;\">Finished Work vs. Process Work<\u002Fh3>\n                <div style=\"display:flex; flex-direction:column;\">\n                  <sc-for list=\"{{ introAccordions }}\" as=\"row\" hint-placeholder-count=\"2\">\n                    <div sc-camel-on-mouse-enter=\"{{ row.hoverOn }}\" sc-camel-on-mouse-leave=\"{{ row.hoverOff }}\" style=\"position:relative; margin:0 10px 22px 0;\">\n                      <div style=\"{{ row.shadowStyle }}\"><\u002Fdiv>\n                      <div style=\"position:relative; border:1px solid #2e2e2b; background:#fbfbf9;\">\n                        <button sc-camel-on-click=\"{{ row.toggle }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; width:100%; text-align:left; border:0; background:transparent; padding:22px 24px; font-size:13px; color:#2e2e2b; cursor:pointer;\" style-hover=\"background:#f1f1ec;\">\n                          <span>{{ row.label }}<\u002Fspan>\n                          <span style=\"font-size:19px; line-height:1;\">{{ row.glyph }}<\u002Fspan>\n                        <\u002Fbutton>\n                        <sc-if value=\"{{ row.open }}\" hint-placeholder-val=\"{{ false }}\">\n                          <p style=\"margin:0 24px 24px; max-width:70ch; font-size:14px; line-height:1.75; color:#3a3a37;\">{{ row.body }}<\u002Fp>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"border-top:1px solid #8b8b83; background:transparent; color:#2e2e2b; padding:34px 0 10px; margin:0; display:flex; flex-direction:column; gap:14px;\">\n                <span style=\"font-size:12.5px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:#5c5c56;\">Think you’re ready?<\u002Fspan>\n                <button sc-camel-on-click=\"{{ goSubmitPortfolio }}\" style=\"display:flex; align-items:center; gap gin:14px 0 30px;\">\n              <sc-for list=\"{{ crumbs }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <span style=\"display:flex; align-items:center; gap:7px;\">\n                  <span style=\"font-family:ui-monospace, Menlo, monospace; font-size:12px; color:#b0b0a8;\">{{ c.sep }}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ c.go }}\" style=\"{{ c.style }}\" style-hover=\"color:#000;\">{{ c.label }}<\u002Fbutton>\n                <\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fnav>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isElpPage }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid; grid-template-columns:minmax(0,1.55fr) minmax(250px,0.8fr); gap:56px; align-items:start;\">\n              <div style=\"display:flex; flex-direction:column; gap:44px;\">\n                <div style=\"display:flex; flex-direction:column; gap:18px;\">\n                  <span style=\"font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:#3a3a37;\">Undergraduate applicants<\u002Fspan>\n                  <h2 style=\"margin:0; max-width:24ch; font-size:40px; line-height:1.15; font-weight:700; letter-spacing:-0.025em;\">English Language Proficiency Requirements<\u002Fh2>\n                  <p style=\"margin:0; max-width:56ch; font-size:17px; line-height:1.85; color:#2e2e2b; text-wrap:pretty;\">The language/medium of instruction at OCAD University is English. It’s important for your success at OCAD U that you demonstrate proficiency in both spoken and written English that is sufficient to meet the demands of studio/classroom instruction, written assignments, as well as participation in discussions and critiques.<\u002Fp>\n                  <p style=\"margin:0; max-width:70ch; font-size:13.5px; line-height:1.7; color:#3a3a37;\">In addition to meeting <span style=\"border-bottom:2px solid #8b8b83;\">academic entrance requirements<\u002Fspan> and English prerequisite course (if applicable) requirements, <strong>all applicants whose first language is not English are required to submit results of an English Language proficiency test meeting or exceeding the test results indicated below<\u002Fstrong>.<\u002Fp>\n                  <p style=\"margin:0; max-width:70ch; font-size:13.5px; line-height:1.7; color:#3a3a37;\">OCAD University reserves the right to request an English Language Proficiency test from any applicant regardless of their academic background. English Language Proficiency requirements are subject to change.<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"display:flex; flex-direction:column;\">\n                  <sc-for list=\"{{ elpAccordions }}\" as=\"row\" hint-placeholder-count=\"4\">\n                    <div sc-camel-on-mouse-enter=\"{{ row.hoverOn }}\" sc-camel-on-mouse-leave=\"{{ row.hoverOff }}\" style=\"position:relative; margin:0 10px 22px 0;\">\n                      <div style=\"{{ row.shadowStyle }}\"><\u002Fdiv>\n                      <div style=\"position:relative; border:1px solid #2e2e2b; background:#fbfbf9;\">\n                        <button sc-camel-on-click=\"{{ row.toggle }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; width:100%; text-align:left; border:0; background:transparent; padding:22px 24px; font-size:13px; color:#2e2e2b; cursor:pointer;\" style-hover=\"background:#f1f1ec;\">\n                          <span>{{ row.label }}<\u002Fspan>\n                          <span style=\"font-size:19px; line-height:1;\">{{ row.glyph }}<\u002Fspan>\n                        <\u002Fbutton>\n                        <sc-if value=\"{{ row.open }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"display:flex; flex-direction:column; gap:12px; padding:4px 26px 28px;\">\n                            <sc-for list=\"{{ row.blocks }}\" as=\"b\" hint-placeholder-count=\"3\">\n                              <div style=\"{{ b.style }}\">{{ b.text }}<\u002Fdiv>\n                            <\u002Fsc-for>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <div style=\"position:relative; margin:0 12px 14px 0;\">\n                  <div style=\"position:absolute; top:10px; left:10px; right:-12px; bottom:-14px; border:2px solid #2e2e2b;\"><\u002Fdiv>\n                  <div style=\"position:relative; border:2px solid #2e2e2b; background:#fbfbf9; padding:52px 48px 56px; display:flex; flex-direction:column; gap:30px;\">\n                    <h3 style=\"margin:0; max-width:22ch; font-size:34px; line-height:1.15; font-weight:700; letter-spacing:-0.02em;\">Deadlines for Submission of Proof of English Language Proficiency<\u002Fh3>\n                    <div style=\"display:flex; flex-direction:column; gap:16px; padding-left:14px;\">\n                      <sc-for list=\"{{ elpDeadlines }}\" as=\"d\" hint-placeholder-count=\"3\">\n                        <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:16px; align-items:start;\">\n                          <span style=\"display:block; width:19px; height:19px; margin-top:2px; border:2px solid #2e2e2b;\"><\u002Fspan>\n                          <span style=\"font-size:14.5px; line-height:1.6; color:#2e2e2b;\">{{ d }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"position:sticky; top:130px; display:flex; flex-direction:column; gap:14px;\">\n                <span style=\"font-size:19px; color:#2e2e2b;\">Take the Next Step<\u002Fspan>\n                <button sc-camel-on-click=\"{{ goApplyGuide }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:24px; border:0; background:#dededa; padding:22px 24px; font-size:12px; font-weight:700; letter-spacing:0.11em; text-transform:uppercase; color:#22221f; text-align:left; cursor:pointer;\" style-hover=\"background:#cfcfc8;\">\n                  <span>Learn how to apply<\u002Fspan>\n                  <span style=\"font-size:15px; line-height:1;\">⟶<\u002Fspan>\n                <\u002Fbutton>\n                <button sc-camel-on-click=\"{{ goPortfolio }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:24px; border:0; background:#0d0d0b; padding:22px 24px; font-size:12px; font-weight:700; letter-spacing:0.11em; text-transform:uppercase; color:#f7f7f4; text-align:left; cursor:pointer;\" style-hover=\"background:#3a3a37;\">\n                  <span>Prepare your portfolio<\u002Fspan>\n                  <span style=\"font-size:15px; line-height:1;\">⟶<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <section style=\"border-top:1px solid #8b8b83; background:transparent; color:#2e2e2b; padding:34px 0 10px; margin:46px 0 0; display:flex; flex-direction:column; gap:14px;\">\n              <span style=\"font-size:12.5px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:#5c5c56;\">Take the next step<\u002Fspan>\n              <button sc-camel-on-click=\"{{ goApplyGuide }}\" style=\"display:flex; align-items:center; gap:26px; align-self:flex-start; text-align:left; border:0; background:transparent; padding:0; color:#2e2e2b; cursor:pointer;\" style-hover=\"opacity:0.65;\">\n                <span style=\"font-size:46px; line-height:1.02; font-weight:800; letter-spacing:-0.025em; text-transform:uppercase; white-space:nowrap;\">Learn how to apply<\u002Fspan>\n                <span style=\"font-size:26px; line-height:1;\">⟶<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isDiscover }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:70px;\">\n              <section style=\"display:grid; grid-template-columns:1.1fr 1fr; gap:44px; align-items:center;\">\n                <div style=\"display:flex; flex-direction:column; gap:16px;\">\n                  <span style=\"font-family:ui-monospace, Menlo, monospace; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:#6f6f68;\">Discover OCAD U<\u002Fspan>\n                  <h2 style=\"margin:0; font-size:52px; line-height:1.02; font-weight:600; letter-spacing:-0.025em;\">Learn to use your creativity for today’s challenges<\u002Fh2>\n                  <p style=\"margin:0; font-size:17px; color:#4a4a45;\">Explore OCAD U’s Undergraduate Programs<\u002Fp>\n                  <button sc-camel-on-click=\"{{ goSubsitePrograms }}\" style=\"display:flex; align-items:stretch; align-self:flex-start; border:1px solid #2e2e2b; background:#fbfbf9; padding:0; font-size:14px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;\" style-hover=\"background:#eeeee9;\">\n                    <span style=\"padding:14px 20px;\">View programs<\u002Fspan>\n                    <span style=\"display:grid; place-items:center; width:46px; background:#2e2e2b; color:#f7f7f4; font-size:16px;\">→<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"height:320px; background:#e2e2dc; border:1px solid #c9c9c3; display:grid; place-items:center; font-family:ui-monospace, Menlo, monospace; font-size:11.5px; letter-spacing:0.18em; color:#87877f;\">IMAGE<\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"display:grid; grid-template-columns:1.35fr 1fr; gap:56px; align-items:start;\">\n                <div style=\"display:flex; flex-direction:column; gap:16px;\">\n                  <span style=\"font-size:14px; letter-spacing:0.06em; text-transform:uppercase; color:#5c5c56;\">Take on the world<\u002Fspan>\n                  <h3 style=\"margin:0; max-width:15ch; font-size:44px; line-height:1.08; font-weight:700; letter-spacing:-0.025em;\">At OCAD University, we take imagination seriously.<\u002Fh3>\n                  <p style=\"margin:0; max-width:60ch; font-size:17px; line-height:1.75; color:#3a3a37; text-wrap:pretty;\">Located in downtown Toronto, we’re Canada’s oldest and largest university for art, design and media. As a student here, you benefit from hands-on studio learning. You have access to state-of-the-art shops and production facilities for both traditional and digital creation. You also take rich courses in humanities, business and science. The combination is empowering. Through it, you begin to see, make, think and do things differently. You gain incredible insight and skill — everything you need to take on the world.<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"position:relative; margin:6px 10px 10px 0;\">\n                  <div style=\"position:absolute; top:10px; left:10px; right:-10px; bottom:-10px; border:2px solid #2e2e2b;\"><\u002Fdiv>\n                  <div style=\"position:relative; border:2px solid #2e2e2b; background:#fbfbf9; padding:24px 26px 28px; display:flex; flex-direction:column; gap:20px;\">\n                    <span style=\"font-size:17px; font-weight:700;\">Information for…<\u002Fspan>\n                    <sc-for list=\"{{ discoverChips }}\" as=\"c\" hint-placeholder-count=\"5\">\n                      <button sc-camel-on-click=\"{{ c.go }}\" style=\"text-align:left; border:0; background:transparent; padding:0; font-size:15px; color:#2e2e2b; cursor:pointer;\" style-hover=\"text-decoration:underline;\">{{ c.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"border-top:1px solid #4a4a45; padding-top:34px;\">\n                <h3 style=\"margin:0 0 26px; font-size:30px; font-weight:600; letter-spacing:-0.015em;\">Facts &amp; figures<\u002Fh3>\n                <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:26px;\">\n                  <sc-for list=\"{{ discoverFacts }}\" as=\"f\" hint-placeholder-count=\"4\">\n                    <div style=\"display:flex; flex-direction:column; gap:8px;\">\n                      <span style=\"font-size:52px; line-height:1; font-weight:600; letter-spacing:-0.03em;\">{{ f.n }}<\u002Fspan>\n                      <span style=\"font-size:14px; line-height:1.5; color:#5c5c56;\">{{ f.t }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex; gap:14px; flex-wrap:wrap; margin-top:32px;\">\n                  <button style=\"border:1px solid #2e2e2b; background:#3a3a37; color:#f7f7f4; padding:14px 20px; font-size:13.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;\" style-hover=\"background:#22221f;\">Learn more about OCAD U<\u002Fbutton>\n                  <button style=\"border:1px solid #4a4a45; background:#fbfbf9; padding:14px 20px; font-size:13.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;\" style-hover=\"background:#eeeee9;\">Download Viewbook<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"position:relative; margin:0 14px 34px 0;\">\n                <div style=\"position:absolute; top:14px; left:14px; right:-14px; bottom:-14px; border:2px solid #2e2e2b;\"><\u002Fdiv>\n                <div style=\"position:relative; border:2px solid #2e2e2b; background:#fbfbf9; display:grid; grid-template-columns:1fr 1.25fr; min-height:400px;\">\n                  <div style=\"border-right:2px solid #2e2e2b; background:#e2e2dc; display:grid; place-items:center; font-family:ui-monospace, Menlo, monospace; font-size:12px; letter-spacing:0.2em; color:#87877f;\">IMAGE<\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; justify-content:center; gap:16px; padding:48px 56px;\">\n                    <h3 style=\"margin:0; max-width:14ch; font-size:44px; line-height:1.06; font-weight:700; letter-spacing:-0.025em;\">Explore undergraduate programs<\u002Fh3>\n                    <p style=\"margin:0; max-width:52ch; font-size:15.5px; line-height:1.6; color:#3a3a37;\">OCAD U offers 17 undergraduate programs that explore art, design, and media. Which program is right for you?<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ goSubsitePrograms }}\" style=\"position:absolute; right:-14px; bottom:-24px; display:flex; align-items:center; gap:26px; border:0; background:#dededa; padding:22px 30px; font-size:14px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#2e2e2b; cursor:pointer;\" style-hover=\"background:#cfcfc8;\">\n                  <span>Find your program<\u002Fspan>\n                  <span style=\"font-size:18px; line-height:1;\">⟶<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsection>\n\n              <section style=\"border-top:1px solid #4a4a45; padding-top:34px; display:flex; flex-direction:column; gap:40px;\">\n                <div style=\"display:flex; flex-direction:column; gap:12px;\">\n                  <h3 style=\"margin:0; font-size:38px; font-weight:700; letter-spacing:-0.025em;\">Application Support<\u002Fh3>\n                  <p style=\"margin:0; max-width:46ch; font-size:17px; line-height:1.6; color:#3a3a37;\">Explore the admissions website and learn more about applications, programs, portfolios and more!<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:52px 60px; align-items:start;\">\n                  <div style=\"position:relative; margin:0 10px 12px 0;\">\n                    <div style=\"position:absolute; top:10px; left:10px; right:-10px; bottom:-12px; border:2px solid #2e2e2b;\"><\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ goSubsiteVisit }}\" style=\"position:relative; display:flex; flex-direction:column; text-align:left; width:100%; border:2px solid #2e2e2b; background:#fbfbf9; padding:0; cursor:pointer;\" style-hover=\"background:#f1f1ec;\">\n                      <span style=\"display:grid; place-items:center; width:100%; height:420px; background:#e2e2dc; font-family:ui-monospace, Menlo, monospace; font-size:12px; letter-spacing:0.2em; color:#87877f;\">IMAGE<\u002Fspan>\n                      <span style=\"display:flex; flex-direction:column; gap:12px; padding:26px 28px 30px;\">\n                        <span style=\"font-size:30px; font-weight:400; letter-spacing:-0.015em;\">Learn more about OCAD U<\u002Fspan>\n                        <span style=\"font-size:14px; line-height:1.55; color:#3a3a37;\">Check out one of the many info sessions and virtual meet ups we offer to help you better understand our school, programs, and the application process.<\u002Fspan>\n                        <span style=\"font-size:18px; line-height:1; margin-top:6px;\">⟶<\u002Fspan>\n                      <\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fdiv>\n\n                  <div style=\"display:flex; flex-direction:column; gap:46px;\">\n                    <sc-for list=\"{{ discoverPromos }}\" as=\"p\" hint-placeholder-count=\"3\">\n                      <div style=\"position:relative; margin:0 8px 10px 0;\">\n                        <div style=\"position:absolute; top:8px; left:8px; right:-8px; bottom:-10px; border:2px solid #2e2e2b;\"><\u002Fdiv>\n                        <button sc-camel-on-click=\"{{ p.go }}\" style=\"position:relative; display:flex; flex-direction:column; gap:14px; text-align:left; width:100%; border:2px solid #2e2e2b; background:#fbfbf9; padding:28px 30px 26px; cursor:pointer;\" style-hover=\"background:#f1f1ec;\">\n                          <span style=\"font-size:22px; font-weight:400; line-height:1.25; letter-spacing:-0.01em;\">{{ p.title }}<\u002Fspan>\n                          <span style=\"font-size:13.5px; line-height:1.55; color:#3a3a37;\">{{ p.sub }}<\u002Fspan>\n                          <span style=\"font-size:18px; line-height:1; margin-top:4px;\">⟶<\u002Fspan>\n                        <\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"border-top:1px solid #4a4a45; padding-top:26px; display:flex; flex-direction:column; gap:10px;\">\n                <span style=\"font-size:12.5px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#5c5c56;\">Take the next step<\u002Fspan>\n                <button sc-camel-on-click=\"{{ goApply }}\" style=\"display:flex; align-items:center; gap:28px; flex-wrap:wrap; align-self:flex-start; text-align:left; border:0; background:transparent; padding:0; font-size:52px; line-height:1.04; font-weight:800; letter-spacing:-0.02em; text-transform:uppercase; color:#2e2e2b; cursor:pointer;\" style-hover=\"opacity:0.65;\">\n                  <span>Learn how to apply<\u002Fspan>\n                  <span style=\"font-size:34px; line-height:1;\">⟶<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsection>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isApplyPage }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:64px;\">\n              <section style=\"background:#22221f; color:#f7f7f4; padding:64px 44px 150px;\">\n                <h2 style=\"margin:0; max-width:18ch; font-size:64px; line-height:1.02; font-weight:800; letter-spacing:-0.02em; text-transform:uppercase;\">How to get into OCAD University<\u002Fh2>\n              <\u002Fsection>\n\n              <section style=\"display:grid; grid-template-columns:minmax(0,2.1fr) minmax(240px,0.9fr); gap:60px; align-items:start;\">\n                <div style=\"display:flex; flex-direction:column; gap:52px;\">\n                  <div style=\"display:flex; flex-direction:column; gap:18px;\">\n                    <h3 style=\"margin:0; font-size:38px; font-weight:700; letter-spacing:-0.025em;\">Applying to OCAD U<\u002Fh3>\n                    <p style=\"margin:0; max-width:58ch; font-size:16.5px; line-height:1.75; color:#3a3a37; text-wrap:pretty;\">Admission to OCAD U is based primarily on a portfolio or writing submission but strong academic skills are essential for your overall success. All offers of admission are conditional on meeting the minimum academic entrance requirements.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:56px 44px;\">\n                    <sc-for list=\"{{ applyCards }}\" as=\"c\" hint-placeholder-count=\"3\">\n                      <button sc-camel-on-click=\"{{ c.go }}\" style=\"display:flex; flex-direction:column; gap:14px; text-align:left; border:0; background:transparent; padding:0; cursor:pointer;\" style-hover=\"opacity:0.75;\">\n                        <span style=\"display:grid; place-items:center; width:100%; height:230px; background:#e2e2dc; border:1px solid #c9c9c3; font-family:ui-monospace, Menlo, monospace; font-size:11.5px; letter-spacing:0.2em; color:#87877f;\">IMAGE<\u002Fspan>\n                        <span style=\"font-size:26px; font-weight:400; line-height:1.15; letter-spacing:-0.015em;\">{{ c.label }}<\u002Fspan>\n                        <span style=\"font-size:12.5px; line-height:1.5; color:#3a3a37; max-width:34ch;\">{{ c.sub }}<\u002Fspan>\n                        <span style=\"font-size:17px; line-height:1;\">⟶<\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; gap:14px;\">\n                  <span style=\"font-size:16px; color:#3a3a37;\">Take the next step<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ goApplyGuide }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:24px; border:0; background:#dededa; padding:20px 24px; font-size:12.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#22221f; cursor:pointer;\" style-hover=\"background:#cfcfc8;\">\n                    <span>Learn how to apply<\u002Fspan>\n                    <span style=\"font-size:15px; line-height:1;\">⟶<\u002Fspan>\n                  <\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ goGetHelp }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:24px; border:0; background:#22221f; padding:20px 24px; font-size:12.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#f7f7f4; cursor:pointer;\" style-hover=\"background:#3a3a37;\">\n                    <span>Questions? Contact us.<\u002Fspan>\n                    <span style=\"font-size:15px; line-height:1;\">⟶<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"background:#22221f; color:#f7f7f4; padding:56px 44px 64px;\">\n                <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:start;\">\n                  <div style=\"display:flex; flex-direction:column; gap:30px;\">\n                    <h3 style=\"margin:0; font-size:38px; font-weight:700; letter-spacing:-0.025em;\">Connect with us<\u002Fh3>\n                    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:44px 30px;\">\n                      <sc-for list=\"{{ connectCards }}\" as=\"c\" hint-placeholder-count=\"4\">\n                        <div style=\"position:relative; margin:0 8px 10px 0;\">\n                          <div style=\"position:absolute; top:8px; left:8px; right:-8px; bottom:-10px; background:#f7f7f4;\"><\u002Fdiv>\n                          <button sc-camel-on-click=\"{{ c.go }}\" style=\"position:relative; display:flex; flex-direction:column; gap:16px; text-align:left; width:100%; height:100%; border:0; background:#fbfbf9; padding:24px 24px 22px; color:#22221f; cursor:pointer;\" style-hover=\"background:#eeeee9;\">\n                            <span style=\"font-size:20px; font-weight:400; line-height:1.25; letter-spacing:-0.01em;\">{{ c.title }}<\u002Fspan>\n                            <span style=\"font-size:12.5px; line-height:1.55; color:#3a3a37;\">{{ c.sub }}<\u002Fspan>\n                            <span style=\"font-size:17px; line-height:1; margin-top:auto;\">⟶<\u002Fspan>\n                          <\u002Fbutton>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"min-height:520px; background:#3a3a37; border:1px solid #5c5c56; display:grid; place-items:center; font-family:ui-monospace, Menlo, monospace; font-size:12px; letter-spacing:0.2em; color:#a8a8a0;\">IMAGE<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"border-top:1px solid #4a4a45; padding-top:26px; display:flex; flex-direction:column; gap:10px;\">\n                <span style=\"font-size:12.5px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#5c5c56;\">Take the next step<\u002Fspan>\n                <button sc-camel-on-click=\"{{ goApplyGuide }}\" style=\"display:flex; align-items:center; gap:28px; flex-wrap:wrap; align-self:flex-start; text-align:left; border:0; background:transparent; padding:0; font-size:52px; line-height:1.04; font-weight:800; letter-spacing:-0.02em; text-transform:uppercase; color:#2e2e2b; cursor:pointer;\" style-hover=\"opacity:0.65;\">\n                  <span>Learn how to apply<\u002Fspan>\n                  <span style=\"font-size:34px; line-height:1;\">⟶<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsection>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isGradTuition }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid; grid-template-columns:minmax(0,2.9fr) minmax(240px,0.75fr); gap:56px; align-items:start;\">\n              <div style=\"display:flex; flex-direction:column; gap:56px;\">\n                <section style=\"display:flex; flex-direction:column; gap:20px;\">\n                  <h2 style=\"margin:0; font-size:44px; font-weight:400; letter-spacing:-0.02em;\">How it works<\u002Fh2>\n                  <p style=\"margin:0; max-width:80ch; font-size:17px; line-height:1.8; color:#2e2e2b; text-wrap:pretty;\">At OCAD U we're here to help you understand and plan for the costs of your education. Keep reading for information on tuition, then check out our cost calculator below to see an estimate for the program you're interested in.<\u002Fp>\n                  <p style=\"margin:0; max-width:80ch; font-size:17px; line-height:1.8; color:#2e2e2b; text-wrap:pretty;\">Tuition fees are charged at either the <strong>domestic<\u002Fstrong> or <strong>international<\u002Fstrong> rate. The domestic tuition rate applies to Canadian citizens, permanent residents and their dependents, as well as exempted international students. The international tuition rate applies to all other students.<\u002Fp>\n                  <p style=\"margin:0; max-width:80ch; font-size:17px; line-height:1.8; color:#2e2e2b;\">Fee rates for each of our 7 graduate programs vary.<\u002Fp>\n                <\u002Fsection>\n\n                <section style=\"display:flex; flex-direction:column; gap:34px;\">\n                  <div style=\"display:flex; flex-direction:column; gap:14px;\">\n                    <p style=\"margin:0; font-size:17px; line-height:1.7; color:#2e2e2b;\">Fees are calculated on a <strong>per-credit*<\u002Fstrong> basis for the following programs:<\u002Fp>\n                    <ul style=\"margin:0; padding-left:22px; display:flex; flex-direction:column; gap:8px; font-size:16px; line-height:1.6; color:#3a3a37;\">\n                      <sc-for list=\"{{ perCreditPrograms }}\" as=\"p\" hint-placeholder-count=\"3\">\n                        <li>{{ p }}<\u002Fli>\n                      <\u002Fsc-for>\n                    <\u002Ful>\n                    <p style=\"margin:6px 0 0; max-width:80ch; font-size:13.5px; line-height:1.65; font-style:italic; color:#6f6f68;\">*In full-time programs you will take 1.0-2.5 credits per semester. Check out your program guide for a more detailed breakdown.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; gap:14px;\">\n                    <p style=\"margin:0; font-size:17px; line-height:1.7; color:#2e2e2b;\">Fees are calculated on a <strong>per-semester<\u002Fstrong> basis for the following programs:<\u002Fp>\n                    <ul style=\"margin:0; padding-left:22px; display:flex; flex-direction:column; gap:8px; font-size:16px; line-height:1.6; color:#3a3a37;\">\n                      <sc-for list=\"{{ perSemesterPrograms }}\" as=\"p\" hint-placeholder-count=\"4\">\n                        <li>{{ p }}<\u002Fli>\n                      <\u002Fsc-for>\n                    <\u002Ful>\n                  <\u002Fdiv>\n                <\u002Fsection>\n\n                <section style=\"position:relative; margin:0 12px 12px 0;\">\n                  <div style=\"{{ laptopAcc.shadowStyle }}\"><\u002Fdiv>\n                  <div style=\"position:relative; border:1px solid #2e2e2b; background:#fbfbf9;\">\n                    <button sc-camel-on-click=\"{{ laptopAcc.toggle }}\" sc-camel-on-mouse-enter=\"{{ laptopAcc.hoverOn }}\" sc-camel-on-mouse-leave=\"{{ laptopAcc.hoverOff }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:24px; width:100%; text-align:left; border:0; background:transparent; padding:24px 26px; font-size:19px; font-weight:400; color:#2e2e2b; cursor:pointer;\">\n                      <span>{{ laptopAcc.label }}<\u002Fspan>\n                      <span style=\"font-size:19px; line-height:1;\">{{ laptopAcc.glyph }}<\u002Fspan>\n                    <\u002Fbutton>\n                    <sc-if value=\"{{ laptopAcc.open }}\" hint-placeholder-val=\"{{ false }}\">\n                      <p style=\"margin:0 26px 26px; max-width:70ch; font-size:14.5px; line-height:1.75; color:#3a3a37;\">{{ laptopAcc.body }}<\u002Fp>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsection>\n\n                <section style=\"display:flex; flex-direction:column; gap:22px;\">\n                  <span style=\"font-size:12.5px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:#6f6f68;\">Estimate your costs<\u002Fspan>\n                  <h2 style=\"margin:0; font-size:44px; font-weight:400; letter-spacing:-0.02em;\">Tuition Estimates<\u002Fh2>\n                  <p style=\"margin:0; max-width:80ch; font-size:17px; line-height:1.8; color:#2e2e2b;\">The <strong>approximate<\u002Fstrong> total tuition for each program is as follows:<\u002Fp>\n                  <ul style=\"margin:0; padding-left:22px; display:flex; flex-direction:column; gap:10px; font-size:18px; line-height:1.55; font-weight:600; color:#2e2e2b;\">\n                    <sc-for list=\"{{ tuitionEstimates }}\" as=\"e\" hint-placeholder-count=\"2\">\n                      <li>{{ e }}<\u002Fli>\n                    <\u002Fsc-for>\n                  <\u002Ful>\n                  <p style=\"margin:0; max-width:62ch; font-size:13px; line-height:1.65; font-style:italic; color:#6f6f68;\">*Tuition fees are approximate and change slightly from year to year. Reviewing the current year can give you an idea of what the tuition fees will be for your program of interest.<\u002Fp>\n                  <p style=\"margin:8px 0 0; max-width:80ch; font-size:17px; line-height:1.8; color:#2e2e2b;\">Review the cost calculator below to get an estimate on your costs as an OCAD U student:<\u002Fp>\n                  <div style=\"display:flex; flex-direction:column; gap:30px;\">\n                    <div style=\"display:flex; flex-direction:column; gap:18px;\">\n                      <sc-for list=\"{{ calcFields }}\" as=\"f\" hint-placeholder-count=\"7\">\n                        <label style=\"display:grid; grid-template-columns:200px minmax(0,300px); gap:24px; align-items:center;\">\n                          <span style=\"font-size:16px; color:#2e2e2b;\">{{ f.label }}<\u002Fspan>\n                          <sc-raw-select style=\"width:100%; border:2px solid #0d0d0b; background:#fbfbf9; padding:11px 12px; font-family:inherit; font-size:15px; color:#0d0d0b; cursor:pointer;\">\n                            <sc-for list=\"{{ f.options }}\" as=\"o\" hint-placeholder-count=\"2\">\n                              <option>{{ o }}<\u002Foption>\n                            <\u002Fsc-for>\n                          <\u002Fsc-raw-select>\n                        <\u002Flabel>\n                      <\u002Fsc-for>\n                      <div style=\"display:grid; grid-template-columns:200px minmax(0,300px); gap:24px; align-items:center;\">\n                        <span style=\"font-size:16px; color:#2e2e2b;\">Laptop program<\u002Fspan>\n                        <button sc-camel-on-click=\"{{ toggleLaptopFee }}\" style=\"{{ laptopBoxStyle }}\">\n                          <sc-if value=\"{{ laptopFee }}\" hint-placeholder-val=\"{{ true }}\">\n                            <span style=\"font-size:13px; line-height:1; color:#fbfbf9;\">✓<\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fbutton>\n                      <\u002Fdiv>\n                      <label style=\"display:grid; grid-template-columns:200px minmax(0,300px); gap:24px; align-items:center;\">\n                        <span style=\"font-size:16px; color:#2e2e2b;\">Laptop options<\u002Fspan>\n                        <sc-raw-select style=\"width:100%; border:2px solid #0d0d0b; background:#fbfbf9; padding:11px 12px; font-family:inherit; font-size:15px; color:#0d0d0b; cursor:pointer;\">\n                          <option>Using current laptop<\u002Foption>\n                          <option>Purchasing new laptop<\u002Foption>\n                        <\u002Fsc-raw-select>\n                      <\u002Flabel>\n                    <\u002Fdiv>\n                    <div style=\"display:flex; flex-direction:column; gap:18px;\">\n                      <button style=\"align-self:flex-start; border:0; background:#0d0d0b; padding:14px 22px; font-family:inherit; font-size:15px; font-weight:600; color:#f7f7f4; cursor:pointer;\" style-hover=\"background:#3a3a37;\">Estimate Costs<\u002Fbutton>\n                      <p style=\"margin:0; max-width:76ch; font-size:13.5px; line-height:1.6; color:#3a3a37;\">* Fees are subject to change. Official OCAD University fees can be found on the <span style=\"text-decoration:underline;\">tuition and fees<\u002Fspan> section of this website. Other costs vary by individual circumstance and choice.<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsection>\n              <\u002Fdiv>\n\n              <div style=\"display:flex; flex-direction:column; gap:14px;\">\n                <span style=\"font-size:20px; color:#2e2e2b;\">Take The Next Step<\u002Fspan>\n                <button sc-camel-on-click=\"{{ goGradFunding }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:24px; border:0; background:#dededa; padding:20px 24px; font-size:12.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#22221f; cursor:pointer;\" style-hover=\"background:#cfcfc8;\">\n                  <span>Funding<\u002Fspan>\n                  <span style=\"font-size:15px; line-height:1;\">⟶<\u002Fspan>\n                <\u002Fbutton>\n                <button sc-camel-on-click=\"{{ goGetHelp }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:24px; border:0; background:#22221f; padding:20px 24px; font-size:12.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#f7f7f4; cursor:pointer;\" style-hover=\"background:#3a3a37;\">\n                  <span>Contact Us<\u002Fspan>\n                  <span style=\"font-size:15px; line-height:1;\">⟶<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <section style=\"border-top:1px solid #4a4a45; margin-top:70px; padding-top:26px; display:flex; flex-direction:column; gap:16px;\">\n              <span style=\"font-size:12.5px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#5c5c56;\">Take the next step<\u002Fspan>\n              <button sc-camel-on-click=\"{{ goGradFunding }}\" style=\"display:flex; align-items:center; gap:28px; flex-wrap:wrap; align-self:flex-start; text-align:left; border:0; background:transparent; padding:0; font-size:52px; line-height:1.04; font-weight:800; letter-spacing:-0.02em; text-transform:uppercase; color:#2e2e2b; cursor:pointer;\" style-hover=\"opacity:0.65;\">\n                <span>Learn about Funding<\u002Fspan>\n                <span style=\"font-size:34px; line-height:1;\">⟶<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isGradEvents }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:56px; max-width:980px;\">\n              <section style=\"display:flex; flex-direction:column; gap:18px;\">\n                <h2 style=\"margin:0; font-size:44px; font-weight:400; letter-spacing:-0.02em;\">Connect with OCAD U<\u002Fh2>\n                <p style=\"margin:0; max-width:78ch; font-size:17px; line-height:1.8; color:#2e2e2b; text-wrap:pretty;\">Whether you're ready to apply or just starting your graduate journey, OCAD University is here to support you! Hear from OCAD U graduate advisors, current students and staff about the OCAD U experience. Keep reading to discover our various event and info session recordings, then head to our Contact page to book a one-on-one!<\u002Fp>\n              <\u002Fsection>\n\n              <sc-for list=\"{{ eventGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n                <section style=\"display:flex; flex-direction:column; gap:0;\">\n                  <button sc-camel-on-click=\"{{ g.toggle }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:24px; width:100%; text-align:left; border:0; border-top:1.5px solid #2e2e2b; border-bottom:1.5px solid #2e2e2b; background:transparent; padding:22px 4px; font-size:26px; font-weight:400; color:#2e2e2b; cursor:pointer;\" style-hover=\"background:#f1f1ec;\">\n                    <span>{{ g.label }}<\u002Fspan>\n                    <span style=\"font-size:22px; line-height:1;\">{{ g.glyph }}<\u002Fspan>\n                  <\u002Fbutton>\n                  <sc-if value=\"{{ g.open }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"display:flex; flex-direction:column; gap:34px; padding:30px 4px 8px;\">\n                      <p style=\"margin:0; max-width:74ch; font-size:16px; line-height:1.75; font-style:italic; color:#3a3a37; text-wrap:pretty;\">{{ g.intro }}<\u002Fp>\n                      <div style=\"display:flex; flex-direction:column; gap:0;\">\n                        <sc-for list=\"{{ g.items }}\" as=\"e\" hint-placeholder-count=\"4\">\n                          <div style=\"display:grid; grid-template-columns:minmax(0,1fr) 200px; gap:24px 32px; align-items:start; border-top:1px solid #c4c4bd; padding:24px 4px;\">\n                            <div style=\"display:flex; flex-direction:col op:14px; font-size:12px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase;\">Find us on Instagram ⟶<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"position:relative; margin:0 10px 12px 0;\">\n                  <div style=\"position:absolute; top:10px; left:10px; right:-10px; bottom:-12px; border:1.5px solid #2e2e2b;\"><\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ goEventsHelp }}\" style=\"position:relative; height:100%; width:100%; box-sizing:border-box; text-align:left; border:1.5px solid #2e2e2b; background:#fbfbf9; padding:34px 34px 32px; display:flex; flex-direction:column; gap:16px; cursor:pointer;\" style-hover=\"background:#f1f1ec;\">\n                    <span style=\"font-size:26px; font-weight:400; letter-spacing:-0.015em;\">Still have questions?<\u002Fspan>\n                    <span style=\"font-size:14.5px; line-height:1.65; color:#3a3a37;\">Head to our Contact Us page to book a one-on-one chat with our graduate program reps and advisors!<\u002Fspan>\n                    <span style=\"margin-top:auto; padding-top:14px; font-size:12px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase;\">Contact us ⟶<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsection>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isGradFunding }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid; grid-template-columns:minmax(0,2.9fr) minmax(240px,0.75fr); gap:56px; align-items:start;\">\n              <div style=\"display:flex; flex-direction:column; gap:52px;\">\n                <section style=\"display:flex; flex-direction:column; gap:20px;\">\n                  <h2 style=\"margin:0; font-size:44px; font-weight:400; letter-spacing:-0.02em;\">Funding Your Studies<\u002Fh2>\n                  <p style=\"margin:0; max-width:80ch; font-size:17px; line-height:1.8; color:#2e2e2b; text-wrap:pretty;\">Financial planning is important to ensuring success in your graduate degree. Being financially ready will help you focus on your research, classes, studio work, and getting the most out of your time at OCAD U.<\u002Fp>\n                  <p style=\"margin:0; max-width:80ch; font-size:17px; line-height:1.8; color:#2e2e2b; text-wrap:pretty;\">There are many funding options for you here at OCAD U and externally. Here's what you need to know about getting funding:<\u002Fp>\n                  <ul style=\"margin:0; padding-left:22px; display:flex; flex-direction:column; gap:10px; max-width:80ch; font-size:16px; line-height:1.7; color:#3a3a37;\">\n                    <sc-for list=\"{{ fundingBullets }}\" as=\"b\" hint-placeholder-count=\"3\">\n                      <li>{{ b }}<\u002Fli>\n                    <\u002Fsc-for>\n                  <\u002Ful>\n                  <p style=\"margin:0; max-width:80ch; font-size:17px; line-height:1.8; color:#2e2e2b; text-wrap:pretty;\">To put yourself in the best position to receive funding, apply to your program by our <strong><em>Priority Consideration for Funding Deadline<\u002Fem><\u002Fstrong> in mid-January.<\u002Fp>\n                  <p style=\"margin:0; max-width:80ch; font-size:17px; line-height:1.8; color:#2e2e2b;\">Read on for resources to help you get financially ready for your graduate degree.<\u002Fp>\n                <\u002Fsection>\n\n                <section style=\"display:flex; flex-direction:column; gap:22px;\">\n                  <sc-for list=\"{{ fundingAccordions }}\" as=\"row\" hint-placeholder-count=\"7\">\n                    <div style=\"position:relative; margin:0 12px 12px 0;\">\n                      <div style=\"{{ row.shadowStyle }}\"><\u002Fdiv>\n                      <div style=\"position:relative; border:1px solid #2e2e2b; background:#fbfbf9;\">\n                        <button sc-camel-on-click=\"{{ row.toggle }}\" sc-camel-on-mouse-enter=\"{{ row.hoverOn }}\" sc-camel-on-mo :0.1em; text-transform:uppercase; color:#f7f7f4; cursor:pointer;\" style-hover=\"background:#3a3a37;\">\n                  <span>Learn how to apply<\u002Fspan>\n                  <span style=\"font-size:15px; line-height:1;\">⟶<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isFinancesPage }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:70px;\">\n              <section style=\"background:#0d0d0b; color:#f7f7f4; margin:0 -32px; padding:56px 44px 150px; display:flex; flex-direction:column; gap:20px;\">\n                <span style=\"font-size:13px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:#b0b0a8;\">Money matters<\u002Fspan>\n                <h2 style=\"margin:0; max-width:16ch; font-size:64px; line-height:1.02; font-weight:800; letter-spacing:-0.02em; text-transform:uppercase;\">Paying for your education<\u002Fh2>\n              <\u002Fsection>\n\n              <section style=\"display:grid; grid-template-columns:minmax(0,2.1fr) minmax(240px,0.9fr); gap:60px; align-items:start;\">\n                <div style=\"display:flex; flex-direction:column; gap:18px;\">\n                  <h3 style=\"margin:0 0 10px; font-size:52px; font-weight:400; letter-spacing:-0.02em;\">Money Matters<\u002Fh3>\n                  <p style=\"margin:0; max-width:54ch; font-size:19px; line-height:1.85; color:#2e2e2b; text-wrap:pretty;\">Financial planning is important to ensuring success in your graduate degree. Being ready financially will help you focus on your research, classes and getting the most out of your time at OCAD U. Remember, you're not on your own! There are many funding options for you here at OCAD U and externally. Read on for resources to help you get financially ready for your graduate degree.<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; gap:14px;\">\n                  <span style=\"font-size:20px; color:#2e2e2b;\">Take the Next Step<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ goSubsiteApply }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:24px; border:0; background:#dededa; padding:20px 24px; font-size:12.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#22221f; cursor:pointer;\" style-hover=\"background:#cfcfc8;\">\n                    <span>Learn how to apply<\u002Fspan>\n                    <span style=\"font-size:15px; line-height:1;\">⟶<\u002Fspan>\n                  <\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ goGetHelp }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:24px; border:0; background:#22221f; padding:20px 24px; font-size:12.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#f7f7f4; cursor:pointer;\" style-hover=\"background:#3a3a37;\">\n                    <span>Contact us<\u002Fspan>\n                    <span style=\"font-size:15px; line-height:1;\">⟶<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"display:flex; flex-direction:column; gap:36px;\">\n                <h3 style=\"margin:0; max-width:12ch; font-size:44px; line-height:1.08; font-weight:400; letter-spacing:-0.02em;\">Explore fees and funding<\u002Fh3>\n                <div style=\"display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:40px 56px;\">\n                  <sc-for list=\"{{ financeCards }}\" as=\"c\" hint-placeholder-count=\"2\">\n                    <div style=\"position:relative; margin:0 14px 16px 0;\">\n                      <div style=\"position:absolute; top:8px; left:8px; right:-8px; bottom:-8px; border:1.5px solid #2e2e2b;\"><\u002Fdiv>\n                      <div style=\"position:absolute; top:16px; left:16px; right:-16px; bottom:-16px; border:1.5px solid #2e2e2b;\"><\u002Fdiv>\n                      <button sc-camel-on-click=\"{{ c.go }}\" style=\"position:relative; display:flex; flex-direction:column; gap:18px; text-align:left; width:100%; min-height:270px; border:1.5px solid #2e2e2b; background:#fbfbf9; padding:44px 44px 40px; color:#2e2e2b; cursor:pointer;\" style-hover=\"background:#eeeee9;\">\n                        <span style=\"font-size:28px; font-weight:400; line-height:1.15; letter-spacing:-0.015em;\">{{ c.label }}<\u002Fspan>\n                        <span style=\"font-size:14px; line-height:1.55; color:#3a3a37; max-width:34ch;\">{{ c.desc }}<\u002Fspan>\n                        <span style=\"font-size:19px; line-height:1; margin-top:auto;\">⟶<\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"position:relative; margin:0 16px 18px 0;\">\n                <div style=\"position:absolute; top:9px; left:9px; right:-9px; bottom:-9px; border:1.5px solid #2e2e2b;\"><\u002Fdiv>\n                <div style=\"position:absolute; top:18px; left:18px; right:-18px; bottom:-18px; border:1.5px solid #2e2e2b;\"><\u002Fdiv>\n                <div style=\"position:relative; border:1.5px solid #2e2e2b; background:#fbfbf9; display:grid; grid-template-columns:minmax(0,0.85fr) minmax(0,1.15fr); align-items:stretch;\">\n                  <div style=\"min-height:400px; background:#e2e2dc; border-right:1.5px solid #2e2e2b; display:grid; place-items:center; font-family:ui-monospace, Menlo, monospace; font-size:12px; letter-spacing:0.2em; color:#87877f;\">IMAGE<\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; justify-content:center; gap:22px; padding:52px 56px;\">\n                    <h3 style=\"margin:0; max-width:20ch; font-size:42px; line-height:1.12; font-weight:400; letter-spacing:-0.02em;\">Graduate Funding &amp; ap:20px; align-self:flex-start; text-align:left; border:0; background:transparent; padding:0; font-size:20px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#3a3a37; cursor:pointer;\" style-hover=\"opacity:0.65;\">\n                  <span>Go to the homepage<\u002Fspan>\n                  <span style=\"font-size:17px; line-height:1;\">⟶<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsection>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isProgramsPage }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:60px;\">\n              <section style=\"display:flex; flex-direction:column; gap:14px;\">\n                <h2 style=\"margin:0; font-size:38px; font-weight:700; letter-spacing:-0.025em;\">Explore our Programs<\u002Fh2>\n                <p style=\"margin:0; max-width:70ch; font-size:16px; line-height:1.65; color:#3a3a37;\">With so many programs to choose from, it can be overwhelming to find a program that best suits you. Using the program selector tool can help — select keywords below to see which programs best align with your interests.<\u002Fp>\n              <\u002Fsection>\n\n              <section style=\"border:2px solid #2e2e2b; background:#f5f5f2; padding:26px 28px; display:flex; flex-direction:column; gap:20px;\">\n                <div style=\"display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:18px; align-items:end;\">\n                  <label style=\"display:flex; flex-direction:column; gap:8px;\">\n                    <span style=\"font-size:12px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#5c5c56;\">Search<\u002Fspan>\n                    <span style=\"display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid #4a4a45; background:#fbfbf9; padding:12px 14px; font-size:14px; color:#87877f;\">\n                      <span>Search programs<\u002Fspan>\n
