align-items:stretch; align-self:flex-start; margin-top:6px; border:1px solid #2e2e2b; background:#fbfbf9; padding:0; font-size:14px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;\" style-hover=\"background:#eeeee9;\">\n                    <span style=\"padding:14px 20px;\">Request more info<\u002Fspan>\n                    <span style=\"display:grid; place-items:center; width:46px; background:#2e2e2b; color:#f7f7f4; font-size:16px;\">→<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"border-top:1px solid #4a4a45; padding-top:26px; display:flex; flex-direction:column; gap:10px;\">\n                <span style=\"font-size:12.5px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#5c5c56;\">Take the next step<\u002Fspan>\n                <button sc-camel-on-click=\"{{ goApply }}\" style=\"display:flex; align-items:center; gap:28px; flex-wrap:wrap; align-self:flex-start; text-align:left; border:0; background:transparent; padding:0; font-size:52px; line-height:1.04; font-weight:800; letter-spacing:-0.02em; text-transform:uppercase; color:#2e2e2b; cursor:pointer;\" style-hover=\"opacity:0.65;\">\n                  <span>Learn how to apply<\u002Fspan>\n                  <span style=\"font-size:34px; line-height:1;\">⟶<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsection>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isAcademicPage }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:70px;\">\n              <section style=\"background:#0d0d0b; color:#f7f7f4; margin:0 -32px; padding:56px 44px 64px; display:flex; flex-direction:column; gap:52px;\">\n                <div style=\"display:flex; flex-direction:column; gap:14px;\">\n                  <span style=\"font-size:13px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase;\">Apply<\u002Fspan>\n                  <h1 style=\"margin:0; max-width:13ch; font-size:64px; line-height:0.98; font-weight:800; letter-spacing:-0.02em; text-transform:uppercase;\">Admissions &amp; Academic Requirements<\u002Fh1>\n                <\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:44px; align-items:end;\">\n                  <div><\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; gap:12px;\">\n                    <div style=\"position:relative; height:330px; background:#4a4a45; border:1px solid #5c5c56; display:grid; place-items:center; font-family:ui-monospace, Menlo, monospace; font-size:11.5px; letter-spacing:0.2em; color:#b0b0a8;\">\n                      <span>VIDEO — {{ guideVideoState }}<\u002Fspan>\n                      <button sc-camel-on-click=\"{{ toggleGuideVideo }}\" style=\"{{ guideVideoBtnStyle }}\" style-hover=\"background:#e2e2dc;\">\n                        <span style=\"{{ guidePlayGlyph }}\">▶<\u002Fspan>\n                        <span style=\"{{ guidePauseGlyph }}\">\n                          <span style=\"display:block; width:5px; height:20px; background:currentColor;\"><\u002Fspan>\n                          <span style=\"display:block; width:5px; height:20px; background:currentColor;\"><\u002Fspan>\n                        <\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fdiv>\n                    <span style=\"display:block; padding-right:110px; font-size:15px; color:#f2f2ee;\">WATCH: How to apply to OCAD University<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"display:grid; grid-template-columns:minmax(0,1.4fr) minmax(280px,0.85fr); gap:56px; align-items:start;\">\n                <div style=\"display:flex; flex-direction:column; gap:44px;\">\n                  <div style=\"display:flex; flex-direction:column; gap:16px;\">\n                    <span style=\"font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:#3a3a37;\">Prepare for the fall<\u002Fspan>\n                    <h2 style=\"margin:0; max-width:20ch; font-size:38px; line-height:1.15; font-weight:700; letter-spacing:-0.025em;\">Get your application together!<\u002Fh2>\n                    <p style=\"margin:0; max-width:56ch; font-size:17px; line-height:1.8; color:#2e2e2b; text-wrap:pretty;\">What's required for your OCAD U application? Learn about statements, academic requirements, language proficiency and more.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"position:relative; margin:0 12px 14px 0;\">\n                    <div style=\"position:absolute; top:10px; left:10px; right:-12px; bottom:-14px; border:2px solid #2e2e2b;\"><\u002Fdiv>\n                    <div style=\"position:relative; border:2px solid #2e2e2b; background:#fbfbf9; padding:52px 48px 56px; display:flex; flex-direction:column; gap:30px;\">\n                      <h3 style=\"margin:0; max-width:20ch; font-size:34px; line-height:1.15; font-weight:700; letter-spacing:-0.02em;\">Admissions and Academic Requirements Checklist<\u002Fh3>\n                      <div style=\"display:flex; flex-direction:column; gap:16px; padding-left:14px;\">\n                        <sc-for list=\"{{ academicChecklist }}\" as=\"ac\" hint-placeholder-count=\"4\">\n                          <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:16px; align-items:start;\">\n                            <span style=\"display:block; width:19px; height:19px; margin-top:2px; border:2px solid #2e2e2b;\"><\u002Fspan>\n                            <span style=\"font-size:14.5px; line-height:1.6; color:#2e2e2b;\">{{ ac }}<\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; gap:16px;\">\n                  <div style=\"position:relative;\">\n                    <div style=\"position:absolute; top:10px; left:10px; right:-10px; bottom:-10px; border:1px solid #2e2e2b;\"><\u002Fdiv>\n                    <div style=\"position:relative; border:1px solid #2e2e2b; background:#fbfbf9; padding:24px 24px 26px; display:flex; flex-direction:column; gap:14px;\">\n                      <span style=\"font-size:17px; line-height:1.3;\">On this page learn about:<\u002Fspan>\n                      <ul style=\"margin:0; padding-left:18px; display:flex; flex-direction:column; gap:5px; font-size:12.5px; line-height:1.5; color:#3a3a37;\">\n                        <li>Studio and Non-studio Application Requirements<\u002Fli>\n                        <li>Academic Requirements<\u002Fli>\n                        <li>Statement on Application Fraud<\u002Fli>\n                      <\u002Ful>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"margin-top:14px; font-size:17px; color:#2e2e2b;\">Take the next step<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ goApplyGuide }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:24px; border:0; background:#dededa; padding:22px 24px; font-size:12px; font-weight:700; letter-spacing:0.11em; text-transform:uppercase; color:#22221f; cursor:pointer;\" style-hover=\"background:#cfcfc8;\">\n                    <span>Learn how to apply<\u002Fspan>\n                    <span style=\"font-size:15px; line-height:1;\">⟶<\u002Fspan>\n                  <\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ goPortfolio }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:24px; border:0; background:#0d0d0b; padding:22px 24px; font-size:12px; font-weight:700; letter-spacing:0.11em; text-transform:uppercase; color:#f7f7f4; text-align:left; cursor:pointer;\" style-hover=\"background:#3a3a37;\">\n                    <span>Prepare your portfolio<\u002Fspan>\n                    <span style=\"font-size:15px; line-height:1;\">⟶<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"display:flex; flex-direction:column; gap:16px; max-width:820px;\">\n                <span style=\"font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:#3a3a37;\">About applications<\u002Fspan>\n                <h3 style=\"margin:0; font-size:30px; font-weight:700; letter-spacing:-0.02em;\">Statement on Offers of Admission<\u002Fh3>\n                <p style=\"margin:0; font-size:16px; line-height:1.8; color:#2e2e2b; text-wrap:pretty;\">Admission to an undergraduate degree program at OCAD University is based primarily on the review of an applicant's portfolio/supplemental application materials which indicates an applicant's suitability for and ability to be successful within the program applied to.<\u002Fp>\n                <p style=\"margin:0; font-size:16px; line-height:1.8; color:#2e2e2b; text-wrap:pretty;\">Admission to OCAD University is competitive; meeting minimum academic entrance requirements does not guarantee admission. Final decisions on matters of admission rest within the Undergraduate Admissions Office. All admission decisions are final and are not subject to appeal.<\u002Fp>\n              <\u002Fsection>\n\n              <section style=\"display:flex; flex-direction:column; gap:20px; max-width:820px;\">\n                <h3 style=\"margin:0; max-width:24ch; font-size:28px; line-height:1.2; font-weight:400; letter-spacing:-0.015em;\">Studio-based and Non-studio Program Application Requirements<\u002Fh3>\n                <div style=\"display:flex; flex-direction:column;\">\n                  <sc-for list=\"{{ academicAccordions1 }}\" as=\"row\" hint-placeholder-count=\"2\">\n                    <div sc-camel-on-mouse-enter=\"{{ row.hoverOn }}\" sc-camel-on-mouse-leave=\"{{ row.hoverOff }}\" style=\"position:relative; margin:0 10px 22px 0;\">\n                      <div style=\"{{ row.shadowStyle }}\"><\u002Fdiv>\n                      <div style=\"position:relative; border:1px solid #2e2e2b; background:#fbfbf9;\">\n                        <button sc-camel-on-click=\"{{ row.toggle }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; width:100%; text-align:left; border:0; background:transparent; padding:22px 24px; font-size:13px; color:#2e2e2b; cursor:pointer;\" style-hover=\"background:#f1f1ec;\">\n                          <span>{{ row.label }}<\u002Fspan>\n                          <span style=\"font-size:19px; line-height:1;\">{{ row.glyph }}<\u002Fspan>\n                        <\u002Fbutton>\n                        <sc-if value=\"{{ row.open }}\" hint-placeholder-val=\"{{ false }}\">\n                          <p style=\"margin:0 24px 24px; max-width:70ch; font-size:14px; line-height:1.75; color:#3a3a37;\">{{ row.body }}<\u002Fp>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"display:flex; flex-direction:column; gap:20px; max-width:820px;\">\n                <h3 style=\"margin:0; font-size:28px; font-weight:400; letter-spacing:-0.015em;\">Academic Requirements for...<\u002Fh3>\n                <div style=\"display:flex; flex-direction:column;\">\n                  <sc-for list=\"{{ academicAccordions2 }}\" as=\"row\" hint-placeholder-count=\"5\">\n                    <div sc-camel-on-mouse-enter=\"{{ row.hoverOn }}\" sc-camel-on-mouse-leave=\"{{ row.hoverOff }}\" style=\"position:relative; margin:0 10px 22px 0;\">\n                      <div style=\"{{ row.shadowStyle }}\"><\u002Fdiv>\n                      <div style=\"position:relative; border:1px solid #2e2e2b; background:#fbfbf9;\">\n                        <button sc-camel-on-click=\"{{ row.toggle }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; width:100%; text-align:left; border:0; background:transparent; padding:22px 24px; font-size:13px; color:#2e2e2b; cursor:pointer;\" style-hover=\"background:#f1f1ec;\">\n                          <span>{{ row.label }}<\u002Fspan>\n                          <span style=\"font-size:19px; line-height:1;\">{{ row.glyph }}<\u002Fspan>\n                        <\u002Fbutton>\n                        <sc-if value=\"{{ row.open }}\" hint-placeholder-val=\"{{ false }}\">\n                          <p style=\"margin:0 24px 24px; max-width:70ch; font-size:14px; line-height:1.75; color:#3a3a37;\">{{ row.body }}<\u002Fp>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"display:flex; flex-direction:column; gap:16px; max-width:820px;\">\n                <span style=\"font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:#3a3a37;\">Important details<\u002Fspan>\n                <h3 style=\"margin:0; font-size:30px; font-weight:700; letter-spacing:-0.02em;\">Statement on Application Fraud<\u002Fh3>\n                <p style=\"margin:0; font-size:16px; line-height:1.8; color:#2e2e2b; text-wrap:pretty;\">It is the applicant's responsibility to ensure that application information and all supporting documentation is truthful, complete and correct. OCAD University reserves the right to verify any information provided as part of the application. It is an act of serious academic misconduct to provide any false or misleading information in an application.<\u002Fp>\n                <p style=\"margin:0; font-size:16px; line-height:1.8; color:#2e2e2b; text-wrap:pretty;\">OCAD University reserves the right to be the sole arbiter of what it will accept on an academic and equivalency basis. Admission and academic entrance requirements are subject to change.<\u002Fp>\n              <\u002Fsection>\n\n              <section style=\"border-top:1px solid #8b8b83; background:transparent; color:#2e2e2b; padding:34px 0 10px; margin:0; display:flex; flex-direction:column; gap:14px;\">\n                <span style=\"font-size:12.5px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:#5c5c56;\">Take the next step<\u002Fspan>\n                <button sc-camel-on-click=\"{{ goPortfolio }}\" style=\"display:flex; align-items:center; gap:26px; align-self:flex-start; text-align:left; border:0; background:transparent; padding:0; color:#2e2e2b; cursor:pointer;\" style-hover=\"opacity:0.65;\">\n                  <span style=\"font-size:46px; line-height:1.02; font-weight:800; letter-spacing:-0.025em; text-transform:uppercase; white-space:nowrap;\">Prepare your portfolio<\u002Fspan>\n                  <span style=\"font-size:26px; line-height:1;\">⟶<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsection>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isPortfolioPage }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:70px;\">\n              <section style=\"display:grid; grid-template-columns:minmax(0,1.6fr) minmax(280px,0.85fr); gap:60px; align-items:start;\">\n                <div style=\"display:flex; flex-direction:column; gap:20px;\">\n                  <span style=\"font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:#3a3a37;\">Building a portfolio<\u002Fspan>\n                  <h2 style=\"margin:0; max-width:22ch; font-size:40px; line-height:1.15; font-weight:700; letter-spacing:-0.025em;\">Show your passion and ability to think creatively!<\u002Fh2>\n                  <p style=\"margin:0; max-width:56ch; font-size:17px; line-height:1.9; color:#2e2e2b; text-wrap:pretty;\">Your portfolio is a collection of work that represents your individual creative and technical experiences and accomplishments and should be a visual representation of who you are. You need to demonstrate that you are a visual communicator and that you are well-equipped to succeed at OCAD U. Keep in mind that when it comes to your portfolio, some of the most important features we look for are skill, passion, curiosity and your ability to think creatively.<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; gap:18px;\">\n                  <div style=\"position:relative;\">\n                    <div style=\"position:absolute; top:10px; left:10px; right:-10px; bottom:-10px; border:1px solid #2e2e2b;\"><\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ goWorkshops }}\" style=\"position:relative; display:flex; flex-direction:column; gap:16px; width:100%; text-align:left; border:1px solid #2e2e2b; background:#fbfbf9; padding:30px 30px 34px; cursor:pointer;\" style-hover=\"background:#eeeee9;\">\n                      <span style=\"max-width:16ch; font-size:22px; line-height:1.25;\">Attend a Portfolio Building Workshop<\u002Fspan>\n                      <span style=\"font-size:13.5px; line-height:1.55; color:#3a3a37;\">Learn more about our OCAD U portfolio-building programs through-out the year!<\u002Fspan>\n                      <span style=\"margin-top:8px; font-size:18px; line-height:1;\">⟶<\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fdiv>\n                  <span style=\"margin-top:14px; font-size:19px; color:#2e2e2b;\">Take the Next Step<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ goIntroPortfolios }}\" style=\"display:flex; align-items:center; border:0; background:#dededa; padding:30px 26px; font-size:12.5px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#22221f; cursor:poi mended deadline for fall 2026 applications.\n                            <ul style=\"margin:8px 0 0; padding-left:22px; list-style:circle;\">\n                              <li>Applications are still being considered after this deadline.<\u002Fli>\n                            <\u002Ful>\n                          <\u002Fli>\n                          <li>\n                            <strong>February 10, 2026 -<\u002Fstrong> Portfolio submission deadline\n                            <ul style=\"margin:8px 0 0; padding-left:22px; list-style:circle;\">\n                              <li>Late applicants will be provided with a specific deadline for portfolio submission after the application is received.<\u002Fli>\n                            <\u002Ful>\n                          <\u002Fli>\n                          <li><strong>March 2026:<\u002Fstrong> Initial round of offers of admission go out.<\u002Fli>\n                          <li><strong>April and May 2026:<\u002Fstrong> Late offers of admission go out.<\u002Fli>\n                        <\u002Ful>\n                        <p style=\"margin:6px 0 0; font-size:14.5px; font-weight:700; color:#2e2e2b;\">Post-offer<\u002Fp>\n                        <ul style=\"margin:0; padding-left:22px; display:flex; flex-direction:column; gap:8px; font-size:14px; line-height:1.5; color:#2e2e2b;\">\n                          <li>Accept your offer of admission<\u002Fli>\n                          <li><strong>July 2026 -<\u002Fstrong> Recommended deadline to submit official documents.<\u002Fli>\n                          <li><strong>August 2026 -<\u002Fstrong> Final deadline to submit official documents.<\u002Fli>\n                        <\u002Ful>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsection>\n\n              <section style=\"display:grid; grid-template-columns:minmax(0,1.4fr) minmax(260px,0.8fr); gap:60px; align-items:start;\">\n                <div style=\"display:flex; flex-direction:column; gap:16px;\">\n                  <span style=\"font-size:11.5px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:#5c5c56;\">Applying to OCAD U<\u002Fspan>\n                  <h3 style=\"margin:0; font-size:32px; font-weight:700; letter-spacing:-0.02em;\">How it works<\u002Fh3>\n                  <p style=\"margin:0; max-width:60ch; font-size:16px; line-height:1.75; color:#3a3a37; text-wrap:pretty;\">All applications for admission are made online through the Ontario Universities' Application Centre (OUAC). The only entry point is in September each year. The recommended deadline to apply for all programs at OCAD University is early February. Applications may be considered after this deadline if space is available. Offers of admission to OCAD U's programs are based primarily on the strength of the applicant's portfolio or writing sample. All offers are conditional upon meeting the minimum academic requirements and supplying all required documentation.<\u002Fp>\n                  <button style=\"display:flex; align-items:center; justify-content:space-between; gap:36px; align-self:flex-start; margin-top:10px; border:0; background:#dededa; padding:18px 22px; font-size:11.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#22221f; cursor:pointer;\" style-hover=\"background:#cfcfc8;\">\n                    <span>Ontario University Application Centre<\u002Fspan>\n                    <span style=\"font-size:15px; line-height:1;\">⟶<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; gap:16px;\">\n                  <div style=\"position:relative;\">\n                    <div style=\"position:absolute; top:8px; left:8px; right:-8px; bottom:-8px; border:1px solid #2e2e2b;\"><\u002Fdiv>\n                    <div style=\"position:relative; border:1px solid #2e2e2b; b ife, and student services.\" },\n            { t: \"Learn more about Graduate Studies\", when: \"Watch Recording with ASL\", d: \"Hear from our Graduate Advisor and learn more about our 7 graduate programs, instructors, the application process and more!\" },\n            { t: \"International Graduate Student Session\", when: \"Watch Recording\", d: \"Hear from the School of Graduate Studies and the Office of International Student Support as they discuss the study permit process, housing, living expenses, student services and more!\" }\n          ]\n        },\n        {\n          key: \"eg1\",\n          label: \"Ready to Apply?\",\n          intro: \"Are you prepared to start your application? Learn more about your program(s) of interest and the campus experience with a graduate tour. Then, watch our info session recordings to get further details on programs, funding, portfolios and more.\",\n          items: [\n            { t: \"2025 Graduate Open House Recordings\", when: \"\", d: \"Watch a series of program info sessions and mini-lectures to learn about OCAD U graduate programs, and where they can take you!\" },\n            { t: \"Meet with a Graduate Student Mentor\", when: \"Ongoing\", d: \"Get a deeper understanding of the student experience. Connect with current graduate students to get insight on studying in our programs. Discuss program pathways, student life, and studying in Toronto.\" },\n            { t: \"Portfolio Guidance Info Session\", when: \"Watch Recording\", d: \"Gain insight and information on how to be strategic with choosing works and to best communicate the scope of your practice in your application.\" },\n            { t: \"Writing a Strong Application\", when: \"Watch Recording\", d: \"Join faculty across Graduate Studies to learn best practices and time-honoured tips for clear and exciting application writing.\" },\n            { t: \"Experiential Learning for Graduate Applicants\", when: \"Watch Recording\", d: \"Interested in workplace and career opportunities during your graduate studies? Learn more about OCAD U's Experiential Learning Placement Program (EXPL).\" },\n            { t: \"Graduate Student Insight Series\", when: \"Watch Recording\", d: \"Hear from our graduate student mentors to learn more about our programs, life at OCAD U, studying remotely, and what our campus has to offer.\" }\n          ]\n        }\n      ].map((g) => {\n        const open = (this.state.evAcc || {})[g.key] !== false;\n        return Object.assign({}, g, {\n          open: open,\n          glyph: open ? \"⌃\" : \"⌄\",\n          toggle: () => this.setState((st) => ({ evAcc: Object.assign({}, st.evAcc, { [g.key]: !((st.evAcc || {})[g.key] !== false) }) }))\n        });\n      }),\n      goEventsHelp: this.nav(GRAD + \"/get-help/contact-us\"),\n      fundingBullets: [\n        \"Applicants may receive funding from OCAD U to help offset tuition or living expenses.\",\n        \"Funding packages are typically sent out alongside an offer of admission.\",\n        \"If you don't receive funding with your offer of admission, you can apply for scholarships and other funding opportunities during your studies.\"\n      ],\n      fundingAccordions: [\n        { key: \"entrance\", label: \"Entrance scholarships\", body: \"All applicants to full-time programs can opt-in to consideration for internal entrance scholarships when they apply to graduate studies. Ranging from $1,000 to $23,750, these competitive scholarships are awarded to applicants with strong GPAs, professional/academic backgrounds, and research proposals.\" },\n        { key: \"ogs\", label: \"Ontario Graduate Scholarships (OGS)\", body: \"The Ontario Graduate Scholarship (OGS) is valued at $5,000 per academic term for either two or three consecutive terms. Deadline: January 15, 2026. To be eligible you must be a Canadian citizen, permanent resident, or an international student in Canada on a student visa; be a full-time student in (or have applied to) one of OCAD U's master's programs; have a GPA of 80% or an A- in each of your most recent two years of full-time study; be in good standing with OSAP; and not have exceeded the maximum support restrictions. Complete your OGS application through the OCAD University Application Portal by the deadline.\" },\n        { key: \"external\", label: \"External Scholarships, Awards, and Grants\", body: \"External scholarships, awards and grants require additional separate applications. A few you might be interested in: Canada Graduate Research Scholarships – Master's (CGRS-M), due December 1, 2025 for Canadian citizens, permanent residents and protected persons; the Government of Canada resource page for international students; and Scholarshipscanada.com, a database of internal and external scholarships for students studying at Canadian schools.\" },\n        { key: \"employment\", label: \"Employment\", body: \"Assistantships are paid opportunities to build your resume through teaching or research activities at OCAD U, ranging from 40 to 150 hours per term at approximately $2,000 to $6,000 per appointment. You may be offered a position with your offer of admission, and others are posted on our Employment Opportunities page. Work-Study: OCAD U offers on-campus employment through the Institutional Work-Study Plan and the Campus Employment Program for International Students.\" },\n        { key: \"loans\", label: \"Ontario and Out-Of-Province Loans\", body: \"Government programs like the Ontario Student Assistance Program (OSAP) provide financial aid to students. Out-of-province students can find information on applying for assistance or renewing student loans previously issued through another province or territory on their own provincial or territorial student aid website.\" },\n        { key: \"grants\", label: \"Internal Grants\", body: \"Project and Travel Grants of up to $2,000 per year are available to OCAD U graduate students to support their practice and research activities; an application is required and is made available to registered students at regular intervals throughout each academic year. MRP/Thesis Grants are available to second year students to support final project research and creation.\" },\n        { key: \"bursaries\", label: \"Bursaries\", body: \"There are various bursary programs available to OCAD U students generated through government, donations, endowments, tuition revenue or external agencies. The Ontario Bursary for Students with Disabilities (BSWD) and the Canada Student Grant for Services and Equipment – Students with Disabilities (CSG-DSE) help eligible full-time and part-time students pay for disability-related services and equipment needed to participate in postsecondary studies.\" }\n      ].map((r) => this.accRow(r)),\n      goGradTuition: this.nav(GRAD + \"/finances/tuition-fees\"),\n      perCreditPrograms: [\"Design for Health\",\"Inclusive Design\",\"Strategic Foresight and Innovation\"],\n      perSemesterPrograms: [\"Contemporary Art, Design and Media Art Histories\",\"Criticism & Curatorial Practice\",\"Digital Futures\",\"Interdisciplinary Art, Media and Design\"],\n      tuitionEstimates: [\"Domestic Tuition: $19,000 – $30,000 CAD*\",\"International Tuition: $57,000 – $84,000 CAD*\"],\n      laptopAcc: this.accRow({\n        key: \"laptop\",\n        label: \"Laptop Program\",\n        body: \"The Laptop Program provides software and support for students bringing their own laptops to OCAD U for their learning and instruction in art and design. Graduate students in Digital Futures, Interdisciplinary Master's in Art, Media and Design or Design for Health are expected to have a laptop, either one you own already or one you purchase for school. Through the laptop program, we license Adobe Creative Cloud, Microsoft 365, LinkedIn Learning and other software. The laptop program fee is tax-deductible. As part of the Laptop Program, OCAD U provides comprehensive support through IT Services, including full support for recommended laptop models, assistance with Apple repairs, short-term laptop loans during repairs, malware removal, data recovery, and access to discounted storefronts.\"\n      }),\n      goGradFunding: this.nav(GRAD + \"/finances/funding\"),\n      calcFields: [\n        { label: \"Level of study\", options: [\"Graduate\", \"Undergraduate\"] },\n        { label: \"Year level\", options: [\"1st\", \"2nd\"] },\n        { label: \"Program\", options: [\"Contemporary Art, Design and Media Art Histories\", \"Criticism & Curatorial Practice\", \"Design for Health\", \"Digital Futures\", \"Inclusive Design\", \"Interdisciplinary Master's in Art, Media and Design\", \"Strategic Foresight and Innovation\"] },\n        { label: \"Residency status\", options: [\"Domestic\", \"International\"] },\n        { label: \"Living arrangement\", options: [\"Living at home\", \"Living away from home\", \"Not applicable\"] }\n      ],\n      laptopFee: this.state.laptopFee !== false,\n      laptopBoxStyle: \"display:grid; place-items:center; width:20px; height:20px; padding:0; cursor:pointer; border:1px solid \" + (this.state.laptopFee !== false ? \"#0d0d0b\" : \"#87877f\") + \"; background:\" + (this.state.laptopFee !== false ? \"#0d0d0b\" : \"#fbfbf9\") + \";\",\n      toggleLaptopFee: () => this.setState((st) => ({ laptopFee: st.laptopFee === false })),\n      financeCards: (cur.id === GRAD + \"/finances\" ? cur.children : []).map((cid) => ({\n        label: NODES[cid].label,\n        desc: ({\n          \"Tuition & Fees\": \"Estimate costs of studying at OCAD University.\",\n          \"Tuition + Fees\": \"Estimate costs of studying at OCAD University.\",\n          \"Funding\": \"Learn more about your funding opportunities!\",\n          \"Funding Options\": \"Learn more about your funding opportunities!\",\n          \"Housing info\": \"Find housing partners and off-campus living resources.\",\n          \"Housing Options\": \"Find housing partners and off-campus li  70%; and a total of at least six Grade 12 U or M level courses with a minimum overall academic average of 70%.\" },\n        { key: \"canadian\", label: \"Canadian High School Applicants from Outside Ontario\", body: \"Graduated high school with the equivalent of a 70% minimum average in university preparatory courses, and a senior level academic English course with a minimum final grade of 70% and/or equivalent test. Requirements vary by province.\" },\n        { key: \"intl\", label: \"International Applicants\", body: \"Secondary School Graduation equivalent to Grade 12 in Ontario with an overall average of B or 70% numeric equivalent in the final year. IB, British Pattern Curriculum and Advanced Placement results are also recognized. All international students must have a valid Study Permit before registering.\" },\n        { key: \"transfer\", label: \"Transfer Applicants\", body: \"For first year applicants coming from another university or college, we review grade 12 and/or post-secondary grades against our academic entrance average requirements. Applicants must also meet our English prerequisite with a minimum grade of 70% or equivalent.\" },\n        { key: \"nontrad\", label: \"Non-traditional Applicants\", body: \"To be considered as a Mature Applicant you must be at least 20 years of age by September 1 of the year of intended enrolment and not engaged in formal education for at least two years. OCAD U also accepts successful completion of U of T Woodsworth College's Academic Bridging Program.\" }\n      ].map((r) => this.accRow(r)),\n      isPortfolioPage: isSubsite && cur.id.endsWith(\"/apply/preparing-a-portfolio\"),\n      notPortfolioPage: !(isSubsite && cur.id.endsWith(\"/apply/preparing-a-portfolio\")),\n      isIntroPortfolioPage: isSubsite && cur.id.endsWith(\"/apply/preparing-a-portfolio/intro-to-portfolios\"),\n      isSubmitPortfolioPage: isSubsite && cur.id.endsWith(\"/apply/preparing-a-portfolio/submitting-your-portfolio\"),\n      isElpPage: isSubsite && cur.id.endsWith(\"/apply/english-language-proficiency\"),\n      elpDeadlines: [\n        \"Recommended Deadline: June 1, 2026 (for applicants interested in OCAD U's EAD: Bridge to First Year Program).\",\n        \"Recommended Deadline: July 15, 2026 (for applicants submitting test results to meet full requirements)\",\n        \"Final Deadline: July 31, 2026.\"\n      ],\n      elpAccordions: [\n        { label: \"OCAD U's English for Art & Design (EAD) Language Pathway Program\", blocks: [\n          [\"p\", \"Designed specifically for students who are English Language Learners, English for Art and Design (EAD) provides you with opportunities to build your OCAD U community and to get immersed in the language of art & design.\"],\n          [\"p\", \"Further develop your language skills and a stronger academic foundation before/for your first year.\"],\n          [\"li\", \"Apply for OCAD U's English for Art & Design program if you receive a conditional offer of admission to OCAD University and need to meet English language proficiency requirements.\"],\n          [\"li\", \"By successfully completing and passing the EAD program, you will fulfil OCAD U's English language proficiency requirements for admission and you will not need to retake a language test.\"],\n          [\"li\", \"English for Art & Design is for OCAD U students, taught by OCAD U instructors. To participate in the EAD program, your English language proficiency scores must fall within the EAD discretionary range.\"],\n          [\"link\", \"Learn more about OCAD U's English for Art & Design programs.\"]\n        ] },\n        { label: \"Other English Language Pathway Programs\", blocks: [\n          [\"p\", \"OCAD University will also consider English language training that students have received at our English language school partners to satisfy English Language Proficiency requirements. Official documentation must be submitted directly from the language school partner.\"],\n
